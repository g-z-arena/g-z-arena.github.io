<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GZ Arena</title>
<meta name="theme-color" content="#070a1c">
<link rel="icon" href="Logo.png">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=block" rel="stylesheet">
<style>
:root{--bg:#070a1c;--card:#111838cc;--line:#26307a;--blue:#2f7bff;--purple:#8b3dff;--gold:#ffb400;--text:#eef1ff;--mut:#97a0d0;--ok:#2ee59d;--bad:#ff4d6d}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(600px 400px at 90% -10%,#8b3dff33,transparent),radial-gradient(600px 400px at 0% 100%,#2f7bff33,transparent);pointer-events:none;z-index:-1}
h1,h2,h3,.ch{font-family:Changa,Cairo,sans-serif}
h2{margin:18px 0 6px;font-size:20px}
a{color:inherit}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:#070a1ce6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header img{width:38px;height:38px;border-radius:10px}
header .t{font:800 18px Changa;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
header .sp{flex:1}
.nav{position:fixed;bottom:0;inset-inline:0;z-index:20;display:flex;justify-content:space-around;background:#0a0f2af2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav a{flex:1;text-align:center;color:var(--mut);text-decoration:none;font-size:11px;padding:4px;border-radius:12px}
.nav a span{display:block;font-size:20px}
.nav a.on{color:#fff;background:linear-gradient(135deg,#2f7bff44,#8b3dff44)}
main{max-width:900px;margin:auto;padding:14px 14px 96px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 0 24px #2f7bff14}
.center{text-align:center}
.btn{font:700 15px Changa,Cairo;color:#fff;border:0;border-radius:12px;padding:10px 18px;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 16px #8b3dff55;transition:.15s;text-decoration:none;display:inline-block}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;border:1px solid var(--line);box-shadow:none;color:var(--mut)}
.btn.gold{background:linear-gradient(135deg,#ffb400,#ff7a00);color:#2a1700;box-shadow:0 0 16px #ffb40055}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.4;pointer-events:none}
input,select,textarea{width:100%;font:600 15px Cairo;color:var(--text);background:#0a0f2a;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;margin:4px 0}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px #2f7bff33}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.row>input{flex:1;min-width:120px}
.muted{color:var(--mut);font-size:13px}
.chip{display:inline-block;background:#1a2260;border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--text);cursor:pointer;text-align:right;font-family:inherit}
.tile b{font:700 17px Changa}.tile span{color:var(--mut);font-size:13px}
.game{text-align:center}.game .gi{font-size:44px}.game p{color:var(--mut);font-size:13px;margin:4px 0 10px;min-height:38px}
.hero{display:flex;gap:14px;align-items:center}
.logo-big{width:84px;height:84px;border-radius:20px;box-shadow:0 0 30px #8b3dff77}
.hero>div{flex:1}
.bar{height:10px;background:#0a0f2a;border-radius:9px;overflow:hidden;border:1px solid var(--line);margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--purple),var(--gold));border-radius:9px}
.list>*{margin:6px 0}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.item .g{flex:1}
.rk{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:#0a0f2a;margin:5px 0;text-align:right}
.rk span:nth-child(2){flex:1}
.rk.me{border:1px solid var(--gold)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.tabs button{white-space:nowrap}
.tabs .on{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border-color:transparent}
.ok{color:var(--ok)}.bad{color:var(--bad)}.gold{color:var(--gold)}
#toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-30px);opacity:0;background:#1a2260;border:1px solid var(--blue);padding:10px 18px;border-radius:14px;z-index:99;transition:.25s;pointer-events:none;font-weight:700}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.ok{border-color:var(--ok)}#toast.bad{border-color:var(--bad)}
canvas{max-width:100%;height:auto;border-radius:16px;border:2px solid var(--line);touch-action:none;margin:8px 0}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.secret{font:700 22px Changa;padding:20px;border-radius:16px;margin:12px 0;border:2px dashed currentColor;line-height:1.8}
.code b{font:800 28px Changa;letter-spacing:4px;color:var(--gold)}
.pl{display:inline-flex;gap:6px;align-items:center;background:#0a0f2a;border:1px solid var(--line);border-radius:99px;padding:4px 12px;margin:3px;font-size:13px}
.pl.turn{border-color:var(--gold);box-shadow:0 0 12px #ffb40066}
.mem{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.mc{aspect-ratio:1;font-size:28px;border-radius:12px;border:1px solid var(--line);background:#1a2260;color:#fff;cursor:pointer}
.mc.open{background:#ffffff26}.mc.done{opacity:.45;background:#2ee59d33}
.opt{display:block;width:100%;text-align:right;margin:7px 0;padding:12px;border-radius:12px;border:1px solid var(--line);background:#0a0f2a;color:var(--text);font:600 15px Cairo;cursor:pointer}
.opt.good{background:#2ee59d33;border-color:var(--ok)}.opt.wrong{background:#ff4d6d33;border-color:var(--bad)}
.react{height:200px;border-radius:18px;display:flex;align-items:center;justify-content:center;font:700 22px Changa;background:#1a2260;cursor:pointer;user-select:none;margin:10px 0;text-align:center;padding:10px}
.react.wait{background:#7a1f33}.react.go{background:#16a36b}.react.bad{background:#7a4b1f}
.dpad{display:flex;flex-direction:column;align-items:center;gap:4px;margin:8px 0}
.dpad div{display:flex;gap:4px}
.dpad button{width:56px;height:46px;border-radius:12px;border:1px solid var(--line);background:#1a2260;color:#fff;font-size:18px}
.ttxt{font:700 20px Cairo;line-height:2;background:#0a0f2a;padding:12px;border-radius:12px;margin:10px 0}
.badge{display:inline-block;padding:8px 12px;margin:4px;border-radius:12px;background:#1a2260;border:1px solid var(--gold);font-size:13px}
.badge.lock{opacity:.35;border-color:var(--line);filter:grayscale(1)}
.av{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:8px 0}
.av button{font-size:24px;background:#0a0f2a;border:1px solid var(--line);border-radius:10px;padding:4px;cursor:pointer}
.av button.on{border-color:var(--gold);box-shadow:0 0 10px #ffb40088}
.qa{background:#0a0f2a;border-radius:12px;padding:8px 10px;margin:5px 0;text-align:right;font-size:14px}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat div{background:#0a0f2a;border-radius:12px;padding:10px}.stat b{display:block;font:800 22px Changa;color:var(--gold)}
.load{padding:40px;text-align:center;color:var(--mut)}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:#8b3dff44}
pre{background:#0a0f2a;padding:10px;border-radius:10px;overflow:auto;direction:ltr;text-align:left;font-size:12px}
@media(min-width:700px){.nav{max-width:520px;margin:auto;border-radius:20px 20px 0 0;border:1px solid var(--line)}}

main{max-width:1080px}
header .links{display:none;gap:4px;margin-inline-start:14px}
.links a{padding:6px 14px;border-radius:10px;color:var(--mut);text-decoration:none;font:600 14px Cairo}
.links a.on,.links a:hover{color:#fff;background:#ffffff14}
@media(min-width:760px){header .links{display:flex}.nav{display:none}main{padding-bottom:50px}header{padding:10px 28px}}
@media(max-width:430px){header .t{display:none}}
.land{position:relative;text-align:center;padding:34px 10px 10px}
.land .glow{position:absolute;inset:-60px 0 auto 0;height:420px;background:radial-gradient(closest-side,#8b3dff55,transparent);z-index:-1}
.land img{width:min(210px,52vw);border-radius:34px;box-shadow:0 0 60px #8b3dffaa,0 0 130px #2f7bff55;animation:fl 4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px)}}
.land h1{font:800 clamp(38px,9vw,72px)/1.1 Changa;margin:20px 0 8px;letter-spacing:2px;background:linear-gradient(90deg,#4aa0ff,#a86bff,#ffb400);-webkit-background-clip:text;background-clip:text;color:transparent}
.land p{color:var(--mut);max-width:540px;margin:0 auto 22px;line-height:1.9;font-size:16px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn.lg{padding:14px 30px;font-size:18px;border-radius:16px}
.sec{margin:36px 0 14px;display:flex;align-items:center;gap:12px}
.sec h2{margin:0;font-size:22px;white-space:nowrap}
.sec:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--line),transparent)}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gc{position:relative;overflow:hidden;border-radius:22px;padding:18px 16px;min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;gap:3px;text-decoration:none;color:#fff;border:1px solid #ffffff2a;cursor:pointer;text-align:right;font-family:inherit;transition:.2s;background:var(--g,linear-gradient(135deg,#1b2a7a,#5a22b8))}
.gc:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,#ffffff33,transparent 55%)}
.gc:hover{transform:translateY(-5px);box-shadow:0 14px 38px #8b3dff66}
.gc>*{position:relative}
.gc .ic{position:absolute;top:12px;left:14px;font-size:66px;line-height:1;filter:drop-shadow(0 8px 14px #0009)}
.gc b{font:800 21px Changa}
.gc span{font-size:13px;color:#ffffffd9;line-height:1.6}
.gc .tg{position:absolute;top:14px;right:14px;font-size:11px;background:#0007;padding:2px 10px;border-radius:99px}
.gc .go{font-style:normal;font-weight:700;color:#fff;margin-top:8px;font-size:13px;background:#00000055;align-self:flex-start;padding:4px 12px;border-radius:99px}
.gc.lk{filter:saturate(.8)}
/* أيقونات بطاقات "العب دلوقتي" */
.gc.play{justify-content:flex-start}
.gc.play .gi{align-self:flex-end;width:76px;height:76px;flex:none;display:grid;place-items:center;margin-bottom:14px;border-radius:22px;border:2px solid transparent;background:linear-gradient(160deg,#18235a,#090d26) padding-box,linear-gradient(135deg,#2f7bff,#8b3dff 55%,#ffb400) border-box;box-shadow:0 10px 22px #0006,inset 0 1px 0 #ffffff1f;transition:.25s}
.gc.play .gi svg{width:54px;height:54px;display:block;overflow:visible}
.gc.play:hover .gi{transform:rotate(-6deg) scale(1.07);box-shadow:0 12px 26px #0007,0 0 22px #8b3dffaa}
.gc.play .go{margin-top:auto}
.gc.play .go-gap{flex:1;min-height:8px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.feat div{padding:18px;border-radius:18px;background:#ffffff08;border:1px solid var(--line)}
.feat i{font-style:normal;font-size:32px;display:block;margin-bottom:6px}
.feat p{color:var(--mut);font-size:13px;margin-top:4px;line-height:1.7}
.modal{position:fixed;inset:0;z-index:60;background:#020410b3;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .card{width:100%;max-width:400px;position:relative;background:#0d1230;margin:0;box-shadow:0 0 60px #8b3dff44}
.modal .x{position:absolute;top:10px;left:14px;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.welcome{display:flex;gap:16px;align-items:center;border-radius:26px;padding:24px 22px;margin-top:14px;background:linear-gradient(120deg,#1b2a7acc,#5a22b8cc);border:1px solid #ffffff2a;box-shadow:0 0 50px #8b3dff33}
.welcome .av2{font-size:56px;width:84px;height:84px;display:flex;align-items:center;justify-content:center;background:#0006;border-radius:24px}
.welcome>div:last-child{flex:1}
.welcome h1{font-size:26px;margin-bottom:4px}
.cols{display:grid;grid-template-columns:1fr;gap:0 24px}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr}}

.ms{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:1.2em;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;vertical-align:-.2em;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.ms-svg svg{width:1.2em;height:1.2em;vertical-align:-.22em}
.c-gold{color:#ffb400}.c-red{color:#ff4d6d}.c-blue{color:#4aa0ff}.c-pink{color:#ff6ad5}.c-purple{color:#b07bff}.c-teal{color:#2ee5d0}.c-orange{color:#ff8a2b}.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-cyan{color:#5ee7ff}.c-silver{color:#cfd6ff}.c-bronze{color:#d68a4a}.c-mut{color:var(--mut)}
.float{animation:flt 3s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-4px)}}
.pulse{animation:pls 1.2s ease-in-out infinite}@keyframes pls{50%{opacity:.35;transform:scale(.75)}}
.glow{filter:drop-shadow(0 0 6px #ffb400aa)}
.twinkle{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{transform:scale(1.2) rotate(15deg);opacity:.8}}
.bounce{animation:bn 1s ease infinite}@keyframes bn{50%{transform:translateY(-5px)}}
.wiggle{animation:wg 1.6s ease-in-out infinite}@keyframes wg{20%,60%{transform:rotate(-14deg)}40%,80%{transform:rotate(14deg)}}
.flip{animation:fp 2s ease-in-out infinite}@keyframes fp{50%{transform:rotate(180deg)}}
.flick{animation:fk 1.3s ease-in-out infinite}@keyframes fk{50%{transform:scale(1.15);filter:brightness(1.3)}}
@keyframes pop{50%{transform:scale(1.05)}}
.gc .ic .ms,.gc .ic svg{color:#fff!important;font-size:1em;animation:flt 3s ease-in-out infinite}
.gc .ic .ms-svg svg{width:1em;height:1em}
.nav a>span .ms,.nav a span .ms{font-size:1em}
.mc .ms{font-size:34px}.mc.open{animation:pop .25s}
.hud{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.sncv{width:min(100%,380px);height:auto;aspect-ratio:1;border:2px solid #3b2a8f;border-radius:18px;box-shadow:0 0 40px #8b3dff55,inset 0 0 20px #000;cursor:pointer}
.dpad button{width:64px;height:54px;border-radius:14px;box-shadow:0 4px 0 #0a0f2a}.dpad button:active{transform:translateY(3px);box-shadow:none}.dpad .ms{font-size:32px}
.react{height:220px;box-shadow:inset 0 0 40px #0006}.react>div{display:flex;flex-direction:column;gap:6px;align-items:center}.react .big{font-size:68px}.react.go{animation:pop .25s}
.ttxt{white-space:pre-wrap}.ttxt .tk{color:var(--ok)}.ttxt .tb{color:#fff;background:#ff4d6d66;border-radius:4px}
.opt .lt{display:inline-flex;width:28px;height:28px;border-radius:9px;background:#1a2260;align-items:center;justify-content:center;margin-inline-end:10px;font:700 14px Changa}
#qb{transition:width 1s linear}
#gc{width:min(100%,360px);height:auto;aspect-ratio:1;box-shadow:0 0 40px #8b3dff55}

.cf{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.cf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(108vh) rotate(720deg)}}
.fl{position:fixed;bottom:100px;z-index:70;pointer-events:none;display:flex;flex-direction:column;align-items:center;font:700 12px Cairo;animation:flup 2.4s ease-out forwards}
.fl .ms{font-size:44px}
@keyframes flup{to{transform:translateY(-280px) scale(1.25);opacity:0}}
.rx{display:flex;gap:8px;justify-content:center;margin-bottom:6px}
.rx button{background:#0a0f2a;border:1px solid var(--line);border-radius:12px;padding:4px 12px;cursor:pointer;color:inherit}
.rx button:active{transform:scale(.88)}.rx .ms{font-size:22px}
.lobi{font-size:58px}
.plg{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.pcard{display:flex;flex-direction:column;align-items:center;gap:4px;background:#0a0f2a;border:1px solid var(--line);border-radius:16px;padding:10px 14px;min-width:92px;color:inherit;font-family:inherit;cursor:pointer}
.pcard.sel{border-color:var(--gold);box-shadow:0 0 14px #ffb40088}.pcard:disabled{opacity:.6;cursor:default}.pcard.sel:disabled{opacity:1}
.pav{font-size:34px;line-height:1.2}.pav.sm{font-size:18px}
.opts{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;margin:8px 0}
.podium{display:flex;direction:ltr;justify-content:center;align-items:flex-end;gap:10px;margin:18px 0}
.pd{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:88px}
.pd .pav{font-size:44px}
.pd .pb{width:100%;display:flex;align-items:flex-start;justify-content:center;border-radius:12px 12px 0 0;font:800 26px Changa;padding-top:6px;color:#0b1030}
.pd.p1 .pb{height:120px;background:linear-gradient(#ffd24d,#ff9a00)}.pd.p2 .pb{height:88px;background:linear-gradient(#e3e8ff,#9aa5d6)}.pd.p3 .pb{height:64px;background:linear-gradient(#e6a064,#a8622c)}
.pd.p1 .pav{animation:bn 1.2s ease infinite}
.secretbtn{width:100%;margin:12px 0;padding:22px;border-radius:16px;border:2px dashed var(--line);background:#0a0f2a;color:var(--mut);font:700 16px Cairo;cursor:pointer}
.inner{background:#0a0f2a;margin:10px 0}
.chipb{font:600 13px Cairo;color:var(--text);background:#1a2260;border:1px solid var(--line);border-radius:99px;padding:6px 12px;margin:3px;cursor:pointer}.chipb:disabled{opacity:.35;cursor:default}
.hintp{font:700 22px Changa;letter-spacing:2px;margin:8px 0;min-height:30px;color:var(--gold)}
.fq{background:#0a0f2a;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0;text-align:right;animation:pop .3s}
.fqh{display:flex;gap:6px;align-items:center;margin-bottom:4px}.fqt{font-weight:600}
.ans{display:inline-block;margin-top:6px;padding:3px 14px;border-radius:99px;font:700 14px Changa}
.ans.a-y{background:#2ee59d33;color:var(--ok)}.ans.a-n{background:#ff4d6d33;color:var(--bad)}.ans.a-m{background:#ffb40033;color:var(--gold)}
.vbar{height:10px;background:#0a0f2a;border-radius:9px;overflow:hidden}.vbar i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--bad))}
.vb{display:flex;align-items:center;gap:8px;margin:5px 0}.vb .nm{width:110px;text-align:right;font-size:13px}.vb .vbar{flex:1}
.stars{display:flex;justify-content:center;gap:6px}.stars .star{font-size:62px;color:#2a3170}.stars .star.on{color:#ffb400;animation:starin .5s both;filter:drop-shadow(0 0 12px #ffb400aa)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.mem3{display:grid;gap:8px;margin:12px auto;max-width:480px;perspective:900px}
.mcard{aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer}
.mi{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.flip .mi{transform:rotateY(180deg)}
.mf{position:absolute;inset:0;border-radius:12px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line)}
.mb{background:linear-gradient(135deg,#1b2a7a,#5a22b8);color:#ffffff44}
.mfr{transform:rotateY(180deg);background:linear-gradient(135deg,#0d1338,#1a2260);color:var(--c);box-shadow:inset 0 0 20px #0006}
.mcard.done .mfr{background:#2ee59d22;border-color:var(--ok)}

  view().innerHTML=`<div class="card center"><div style="font-size:64px" id="bigav">${p.avatar}</div><h2>${esc(p.name)}</h2>${xpBar(p)}</div>
  <div class="card"><div class="stat"><div><b>${p.played||0}</b>ألعاب</div><div><b>${p.wins||0}</b>انتصارات</div><div><b>${p.xp||0}</b>XP</div></div></div>
  <div class="card"><b>🎖️ الإنجازات</b><div>${BADGES.map(b=>`<span class="badge ${have.has(b.id)?'':'lock'}" title="${b.d}">${b.n}${have.has(b.id)?'':' — '+b.d}</span>`).join('')}</div></div>
  <div class="card"><b>✏️ تعديل البروفايل</b><div class="av">${AV.map(a=>`<button data-a="pickav" data-v="${a}" class="${a===p.avatar?'on':''}">${a}</button>`).join('')}</div><input id="pn" value="${esc(p.name)}" maxlength="16"><button class="btn" style="margin-top:6px" data-a="saveprof">حفظ</button></div>
  <button class="btn ghost" data-a="logout" style="width:100%">تسجيل خروج</button>`;
}
ACT.pickav=el=>{pickedAv=el.dataset.v;document.querySelectorAll('.av button').forEach(b=>b.classList.toggle('on',b.dataset.v===pickedAv));$('#bigav').textContent=pickedAv};
ACT.saveprof=async()=>{const n=$('#pn').value.trim();if(n.length<2)return toast('الاسم قصير','bad');await updateDoc(doc(db,'users',me()),{name:n,avatar:pickedAv});toast('اتحفظ ✅','ok')};

/* ---------- لوحة الأدمن ---------- */
let AT='q';
function viewAdmin(){
  if(!S.admin){view().innerHTML='<div class="card center">🔒 للأدمن بس</div>';return}
  view().innerHTML=`<h2>⚙️ لوحة الأدمن</h2><div class="tabs">${[['q','🧠 الأسئلة'],['g','🎮 ألعاب الكويز'],['p','🧩 الألغاز'],['e','📅 الفعاليات'],['u','👥 اللاعبين']].map(([k,n])=>`<button class="btn ghost sm" data-a="atab" data-v="${k}">${n}</button>`).join('')}</div><div id="at"></div>`;adminTab(AT)}
ACT.atab=el=>adminTab(el.dataset.v);
async function adminTab(t){AT=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));const box=$('#at');if(!box)return;box.innerHTML='<div class="load">⏳</div>';
  if(t==='q'||t==='g')await loadGames();
  if(t==='g'){
    box.innerHTML=`<div class="card"><b>إضافة لعبة جديدة للكويز</b><input id="gn" placeholder="اسم اللعبة" maxlength="30"><label class="muted" style="display:block;margin:6px 0 2px">شعار اللعبة (PNG / JPG / WEBP / SVG — بيتصغّر تلقائيًا)</label><input id="gf" type="file" accept="image/*"><button class="btn" style="margin-top:6px" data-a="addgame">➕ إضافة اللعبة</button></div>
    <p class="muted">اللعبة الجديدة بتظهر في صفحة الكويز، وتقدر تضيف لها أسئلة من تبويب "الأسئلة". الألعاب الأساسية تقدر ترفع لها شعار بس.</p>
    <div class="list">${Object.entries(QG).map(([k,g])=>`<div class="item"><span class="gl-t">${gIco(g,40)}</span><div class="g"><b>${esc(g.name)}</b><div class="muted">${g.logo?'عليها شعار':'من غير شعار'}${QG0[k]?' • أساسية':''}</div></div><label class="btn sm gold" style="cursor:pointer">🖼 ${g.logo?'تغيير':'رفع'} الشعار<input type="file" accept="image/*" hidden data-ch="setlogo" data-v="${k}"></label>${QG0[k]?(g.logo?`<button class="btn sm ghost" data-a="rmlogo" data-v="${k}">🗑 الشعار</button>`:''):`<button class="btn sm ghost" data-a="delgame" data-v="${k}">🗑 حذف</button>`}</div>`).join('')}</div>`}
  if(t==='q'){const s=await getDocs(collection(db,'quizQuestions'));
    box.innerHTML=`<div class="card"><b>إضافة سؤال</b><select id="qg">${Object.entries(QG).map(([k,g])=>`<option value="${k}">${g.name}</option>`).join('')}</select><input id="qq" placeholder="السؤال">${[1,2,3,4].map(i=>`<input id="qo${i}" placeholder="الاختيار ${i}">`).join('')}<select id="qc"><option value="0">الإجابة الصحيحة: 1</option><option value="1">الإجابة الصحيحة: 2</option><option value="2">الإجابة الصحيحة: 3</option><option value="3">الإجابة الصحيحة: 4</option></select><button class="btn" data-a="addq">➕ إضافة</button></div>
    <p class="muted">الأسئلة الافتراضية بتظهر تلقائيًا لحد ما تضيف أسئلة للعبة — Bomb Squad محتاجة أسئلتك.</p>
    <div class="list">${s.docs.map(d=>{const x=d.data();return `<div class="item"><div class="g"><span class="tag">${QG[x.game]?.name||x.game}</span> ${esc(x.q)}<div class="muted">✔ ${esc(x.o[x.c])}</div></div><button class="btn sm ghost" data-a="del" data-c="quizQuestions" data-v="${d.id}">🗑</button></div>`}).join('')||'<p class="muted">لسه مفيش أسئلة مضافة</p>'}</div>`}
  if(t==='p'){const s=await getDocs(collection(db,'puzzles'));
    box.innerHTML=`<div class="card"><b>إضافة لغز "خمّن اللعبة"</b><input id="pa" placeholder="اسم اللعبة (الإجابة)"><input id="pal" placeholder="أسماء بديلة مفصولة بفاصلة (اختياري)"><input id="pi" dir="ltr" placeholder="رابط صورة مباشر (اختياري)"><input id="pe" placeholder="أو إيموجي بدل الصورة (اختياري)"><select id="pl"><option value="1">مستوى 1 (سهل)</option><option value="2">مستوى 2</option><option value="3">مستوى 3</option><option value="4">مستوى 4</option><option value="5">مستوى 5 (صعب)</option></select><button class="btn" data-a="addp">➕ إضافة</button></div>
    <div class="list">${s.docs.map(d=>{const x=d.data();return `<div class="item"><span style="font-size:24px">${esc(x.emoji||'🖼️')}</span><div class="g">${esc(x.answer)} <span class="tag">Lv ${x.level}</span></div><button class="btn sm ghost" data-a="del" data-c="puzzles" data-v="${d.id}">🗑</button></div>`}).join('')||'<p class="muted">لسه مفيش ألغاز مضافة (فيه 10 افتراضية)</p>'}</div>`}
  if(t==='e'){box.innerHTML=`<div class="card"><b>إضافة بطولة / تحدي / فعالية</b><select id="et"><option value="tournament">بطولة</option><option value="challenge">تحدي</option><option value="event">فعالية</option></select><input id="etl" placeholder="العنوان"><input id="ed" placeholder="الوصف"><input id="eg" placeholder="اللعبة (اختياري)"><input id="ep" placeholder="الجائزة (اختياري)"><input id="edt" type="datetime-local"><button class="btn" data-a="adde">➕ نشر</button></div><p class="muted">الفعاليات الموجودة بتظهر في صفحة "فعاليات" وتقدر تحذفها أو تعلن فائز من هناك.</p>`}
  if(t==='u'){const s=await getDocs(query(collection(db,'users'),orderBy('xp','desc'),limit(100)));
    box.innerHTML=`<div class="list">${s.docs.map(d=>{const u=d.data();return `<div class="item"><span style="font-size:24px">${u.avatar}</span><div class="g">${esc(u.name)}<div class="muted">Lv ${lvl(u.xp)} • ${u.xp} XP • ${u.wins||0} فوز</div></div><button class="btn sm" data-a="gxp" data-v="${d.id}">+50 XP</button></div>`}).join('')}</div>`}}
ACT.addq=async()=>{const o=[1,2,3,4].map(i=>$('#qo'+i).value.trim()),q=$('#qq').value.trim();if(!q||o.some(x=>!x))return toast('كمّل كل الخانات','bad');await addDoc(collection(db,'quizQuestions'),{game:$('#qg').value,q,o,c:+$('#qc').value});toast('اتضاف ✅','ok');adminTab('q')};
ACT.addp=async()=>{const a=$('#pa').value.trim(),i=$('#pi').value.trim(),e=$('#pe').value.trim();if(!a||(!i&&!e))return toast('اكتب الإجابة وصورة أو إيموجي','bad');await addDoc(collection(db,'puzzles'),{answer:a,aliases:$('#pal').value.split(/[,،]/).map(x=>x.trim()).filter(Boolean),img:i,emoji:e,level:+$('#pl').value});toast('اتضاف ✅','ok');adminTab('p')};
ACT.adde=async()=>{const t=$('#etl').value.trim(),d=$('#edt').value;if(!t||!d)return toast('العنوان والموعد مطلوبين','bad');await addDoc(collection(db,'events'),{type:$('#et').value,title:t,desc:$('#ed').value.trim(),game:$('#eg').value.trim(),prize:$('#ep').value.trim(),date:new Date(d).getTime(),p:{},winner:''});toast('اتنشر ✅','ok');$('#etl').value=''};
document.addEventListener('change',e=>{const t=e.target.closest&&e.target.closest('[data-ch]');if(!t)return;Promise.resolve(ACT[t.dataset.ch]?.(t,e)).catch(er=>{console.error(er);toast(er.message||('حصل خطأ: '+(er.code||'')),'bad')})});
ACT.addgame=async()=>{const n=$('#gn').value.trim(),f=$('#gf').files[0];if(!n)return toast('اكتب اسم اللعبة','bad');if(!f)return toast('اختار شعار اللعبة','bad');
  const logo=await imgToLogo(f),id='g'+Date.now().toString(36);await setDoc(doc(db,'quizGames',id),{name:n,logo,createdAt:Date.now()});toast('اتضافت اللعبة ✅','ok');adminTab('g')};
ACT.setlogo=async el=>{const k=el.dataset.v,f=el.files[0];if(!f)return;const logo=await imgToLogo(f);el.value='';await setDoc(doc(db,'quizGames',k),{name:QG[k].name,logo},{merge:true});toast('اتحدّث الشعار ✅','ok');adminTab('g')};
ACT.rmlogo=async el=>{await deleteDoc(doc(db,'quizGames',el.dataset.v));toast('اتشال الشعار','ok');adminTab('g')};
ACT.delgame=async el=>{const k=el.dataset.v;if(!confirm('حذف اللعبة وكل أسئلتها؟'))return;const qs=await getDocs(query(collection(db,'quizQuestions'),where('game','==',k)));await Promise.all(qs.docs.map(d=>deleteDoc(d.ref)));await deleteDoc(doc(db,'quizGames',k));toast('اتحذفت','ok');adminTab('g')};
ACT.gxp=async el=>{await updateDoc(doc(db,'users',el.dataset.v),{xp:increment(50)});toast('+50 XP','ok');adminTab('u')};
</script>
</body>
</html>
